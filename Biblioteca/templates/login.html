{% extends "base.html" %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg mb-4">E</div>
            <h2 class="text-2xl font-bold text-slate-900">Bem-vindo ao EduBiblio</h2>
            <p class="text-slate-500 mt-2 text-sm">Faça login para acessar o acervo</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                <input type="text" name="username" required autofocus class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all bg-slate-50 focus:bg-white" placeholder="Ex: lucas">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all bg-slate-50 focus:bg-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-semibold py-3 rounded-xl transition-all shadow-md mt-4">
                Entrar no Sistema
            </button>
        </form>
        <div class="mt-6 text-center text-xs text-slate-400">
            Teste: admin / admin123
        </div>
    </div>
</div>
{% endblock %}
